# .github/workflows/build.yml
name: build-image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # wöchentlich, damit Basis-Updates einfließen
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atomic-brew

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: podman build -t "${IMAGE}:latest" .

      # podman-Login für den Push (schreibt nach ~/.docker/config.json,
      # damit cosign später dieselben Credentials findet)
      - name: Login GHCR (podman)
        run: |
          mkdir -p ~/.docker
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin \
            --authfile ~/.docker/config.json

      # zusätzlicher Docker-Login: cosign liest ausschließlich ~/.docker/config.json
      - name: Login GHCR (cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          podman push "${IMAGE}:latest" \
            --authfile ~/.docker/config.json \
            --digestfile=/tmp/digest
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Cosign install
        uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # kein Rekor-Upload: die Verifikation läuft rein über cosign.pub,
          # der öffentliche Transparency-Log bringt hier nichts und lässt den
          # Job scheitern, sobald ein Digest schon einmal signiert wurde
          cosign sign --yes --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${{ steps.push.outputs.digest }}"
