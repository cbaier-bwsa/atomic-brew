# .github/workflows/build.yml
name: build-image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # wöchentlich, damit Basis-Updates einfließen
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atomic-brew

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          podman build -f Containerfile      -t "${IMAGE}:base" .
          podman build -f Containerfile.sway -t "${IMAGE}:sway" .
          podman tag "${IMAGE}:sway" "${IMAGE}:latest"

      # podman-Login für den Push (schreibt nach ~/.docker/config.json,
      # damit cosign später dieselben Credentials findet)
      - name: Login GHCR (podman)
        run: |
          mkdir -p ~/.docker
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin \
            --authfile ~/.docker/config.json

      # zusätzlicher Docker-Login: cosign liest ausschließlich ~/.docker/config.json
      - name: Login GHCR (cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cosign install
        uses: sigstore/cosign-installer@v3

      - name: Push & Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for tag in base sway latest; do
            podman push "${IMAGE}:${tag}" \
              --authfile ~/.docker/config.json \
              --digestfile="/tmp/digest-${tag}"
          done
          # :latest teilt sich den Digest mit :sway, und die Signatur hängt am Digest,
          # nicht am Tag — also nur die beiden echten Images signieren.
          # kein Rekor-Upload: die Verifikation läuft rein über cosign.pub,
          # der öffentliche Transparency-Log bringt hier nichts und lässt den
          # Job scheitern, sobald ein Digest schon einmal signiert wurde
          for tag in base sway; do
            cosign sign --yes --tlog-upload=false \
              --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE}@$(cat /tmp/digest-${tag})"
          done
