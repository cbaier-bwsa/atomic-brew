# /usr/lib/tmpfiles.d/linuxbrew.conf
#
# Legt /var/home/linuxbrew bei jedem Boot mit root:wheel + Setgid an, bevor
# homebrew-bootstrap.service (--global enabled, läuft also unter beliebigem
# Erstbenutzer) startet. Da der Benutzername erst zur Laufzeit feststeht
# (kein useradd im Containerfile), kann kein fester Owner ins Image gebacken
# werden. Wheel-Mitglieder (üblich für den primären Desktop-Nutzer auf
# Fedora Atomic) können damit direkt in das Verzeichnis schreiben, sodass
# Homebrews install.sh die interne sudo-Eskalation gar nicht erst auslöst.
d /var/home/linuxbrew 2775 root wheel -
